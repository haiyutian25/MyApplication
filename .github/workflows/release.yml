name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (for example v1.0.0); left empty it is read from the version catalog'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -E '^appVersionName' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "TARGET_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using version tag: $TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The 'tools' package was retired in 2026-09, so the default value no longer resolves.
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # The release keystore is stored in the repository secrets as base64 and restored here.
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded release keystore is empty"
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The keystore and the key inside it share the same password, and the alias is not a secret,
      # so the repository only carries two secrets: the keystore itself and that password.
      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: 'myapplication'
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            RELEASE_KEYSTORE_FILE \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done
          keytool -list \
            -keystore "$RELEASE_KEYSTORE_FILE" \
            -storepass:env RELEASE_KEYSTORE_PASSWORD \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null
          ./gradlew detekt assembleRelease --no-daemon --stacktrace

      - name: Identify and Rename Output APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            TAG="${{ env.TARGET_TAG }}"
            cp "$APK_PATH" "output/MyApplication-arm64-${TAG}.apk"
            sha256sum "output/MyApplication-arm64-${TAG}.apk" > "output/MyApplication-arm64-${TAG}.apk.sha256"
            echo "APK_FILE=output/MyApplication-arm64-${TAG}.apk" >> $GITHUB_ENV
            echo "SHA_FILE=output/MyApplication-arm64-${TAG}.apk.sha256" >> $GITHUB_ENV
          else
            echo "Error: No release APK generated!" && exit 1
          fi

      # The notes are the commits between this tag and the previous version tag, grouped by kind.
      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ env.TARGET_TAG }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          echo "Current tag: $CURRENT_TAG, previous tag: $PREV_TAG"

          if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            CURRENT_REF="$CURRENT_TAG"
          else
            CURRENT_REF="HEAD"
          fi

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log -n 50 --pretty=format:"- %s (%h)" "$CURRENT_REF")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${CURRENT_REF}")
          fi

          FEAT=$(echo "$LOG" | grep -i "^- feat" || true)
          FIX=$(echo "$LOG" | grep -i "^- fix" || true)
          PERF=$(echo "$LOG" | grep -i "^- perf\|^- refactor\|^- improve" || true)
          CHORE=$(echo "$LOG" | grep -Eiv "^- feat|^- fix|^- perf|^- refactor|^- improve" || true)

          {
            echo "## My Application $CURRENT_TAG"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "> Everything that changed since \`$PREV_TAG\`"
            fi
            echo ""
            if [ -n "$FEAT" ]; then
              echo "### ✨ Features"
              echo "$FEAT"
              echo ""
            fi
            if [ -n "$FIX" ]; then
              echo "### 🐛 Fixes"
              echo "$FIX"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### ⚡ Performance and refactoring"
              echo "$PERF"
              echo ""
            fi
            if [ -n "$CHORE" ]; then
              echo "### 🔧 Other changes"
              echo "$CHORE"
              echo ""
            fi
            echo "---"
            echo "**SHA-256**"
            echo "\`\`\`"
            cat "${{ env.SHA_FILE }}"
            echo "\`\`\`"
          } > release_notes.md

          echo "RELEASE_NOTES_FILE=release_notes.md" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: output/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: "My Application ${{ env.TARGET_TAG }}"
          body_path: release_notes.md
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
