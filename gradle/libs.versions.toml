# Please keep each version / library / plugin alphabetized within its own section and subsubsection.
[versions]

# App version
appVersionCode = "1"
appVersionName = "0.0.1-beta.1"

# SDK Versions
compileSdk = "37"
targetSdk = "37"
minSdk = "28"
jvmTarget = "21"

# Dependency Versions
androidGradlePlugin = "9.4.1"
androidxActivity = "1.13.0"
androidxAppCompat = "1.8.0"
androidxComposeBom = "2026.09.00"
androidxCore = "1.19.1"
androidxHiltNavigationCompose = "1.4.0"
androidxLifecycle = "2.11.0"
detekt = "1.23.8"
hilt = "2.60.1"
junit = "6.1.3"
kotlin = "2.4.21"
kotlinxCollectionsImmutable = "0.5.2"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
kotlinxKover = "0.9.11"
ksp = "2.3.12"
mockk = "1.14.11"
navigation3 = "1.2.0"
okhttp = "5.5.0"
retrofitBom = "3.0.0"
robolectric = "4.17"
timber = "5.0.1"
turbine = "1.2.1"

[libraries]
# Format: <maintainer>-<artifact-name>
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
